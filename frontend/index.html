<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 1. Navbar -->
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">💰 Expense Tracker</span>
    </div>
  </nav>

  <div class="container">

    <!-- Alert placeholder: JS fills this in when a request fails -->
    <div id="alertPlaceholder"></div>

    <!-- 2. Summary cards - laid out with CSS Grid (see css/style.css) -->
    <div class="summary-grid mb-4">
      <div class="card text-bg-primary h-100">
        <div class="card-body">
          <h6 class="card-title">Total</h6>
          <p class="card-text fs-3 mb-0" id="summaryTotal">$0.00</p>
        </div>
      </div>
      <div class="card text-bg-secondary h-100">
        <div class="card-body">
          <h6 class="card-title">Number of expenses</h6>
          <p class="card-text fs-3 mb-0" id="summaryCount">0</p>
        </div>
      </div>
      <div class="card text-bg-success h-100">
        <div class="card-body">
          <h6 class="card-title">Highest expense</h6>
          <p class="card-text fs-3 mb-0" id="summaryHighest">$0.00</p>
        </div>
      </div>
    </div>

    <div class="row">
      <!-- 3. Add expense form -->
      <div class="col-lg-4 mb-4">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title mb-3">Add an expense</h5>
            <form id="expenseForm" novalidate>
              <div class="mb-3">
                <label for="title" class="form-label">Title</label>
                <input type="text" class="form-control" id="title" required>
                <div class="invalid-feedback">Title is required.</div>
              </div>
              <div class="mb-3">
                <label for="amount" class="form-label">Amount</label>
                <input type="number" step="0.01" min="0.01" class="form-control" id="amount" required>
                <div class="invalid-feedback">Amount must be greater than 0.</div>
              </div>
              <div class="mb-3">
                <label for="category" class="form-label">Category</label>
                <select class="form-select" id="category" required>
                  <option value="" selected disabled>Choose...</option>
                  <option>Food</option>
                  <option>Transport</option>
                  <option>Bills</option>
                  <option>Entertainment</option>
                  <option>Other</option>
                </select>
                <div class="invalid-feedback">Choose a category.</div>
              </div>
              <div class="mb-3">
                <label for="date" class="form-label">Date</label>
                <input type="date" class="form-control" id="date" required>
                <div class="invalid-feedback">Date is required.</div>
              </div>
              <button type="submit" class="btn btn-primary w-100">Add expense</button>
            </form>
          </div>
        </div>
      </div>

      <!-- 4 & 5. Filter + table -->
      <div class="col-lg-8">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="mb-0">Expenses</h5>
          <select id="categoryFilter" class="form-select w-auto">
            <option value="All" selected>All categories</option>
            <option>Food</option>
            <option>Transport</option>
            <option>Bills</option>
            <option>Entertainment</option>
            <option>Other</option>
          </select>
        </div>

        <!-- Spinner: hidden by default, shown while a request is in flight -->
        <div id="spinner" class="text-center my-4 d-none">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>

        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead>
              <tr>
                <th>Title</th>
                <th>Amount</th>
                <th>Category</th>
                <th>Date</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="expensesTableBody">
              <!-- rows are built by JavaScript, see js/app.js -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Edit modal -->
  <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="editForm" novalidate>
          <div class="modal-header">
            <h5 class="modal-title">Edit expense</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="editId">
            <div class="mb-3">
              <label for="editTitle" class="form-label">Title</label>
              <input type="text" class="form-control" id="editTitle" required>
            </div>
            <div class="mb-3">
              <label for="editAmount" class="form-label">Amount</label>
              <input type="number" step="0.01" min="0.01" class="form-control" id="editAmount" required>
            </div>
            <div class="mb-3">
              <label for="editCategory" class="form-label">Category</label>
              <select class="form-select" id="editCategory" required>
                <option>Food</option>
                <option>Transport</option>
                <option>Bills</option>
                <option>Entertainment</option>
                <option>Other</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="editDate" class="form-label">Date</label>
              <input type="date" class="form-control" id="editDate" required>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
